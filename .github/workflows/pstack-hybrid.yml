name: pstack hybrid
on:
  push:
    branches: [feat/pstack-codex-support]
  pull_request:
    paths: ['pstack/**', '.github/workflows/pstack-hybrid.yml']
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: python -m pip install -r pstack/hybrid/requirements.txt
      - run: python -m unittest discover -s pstack/hybrid/tests -v
      - run: python pstack/hybrid/build.py
      - name: Install and check Codex twice without credentials
        run: |
          bash pstack/hybrid/install-codex.sh
          bash pstack/hybrid/install-codex.sh
          bash pstack/hybrid/check-codex.sh
      - name: Upstream pstack tests and typecheck
        working-directory: pstack/skills/poteto-mode/scripts
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run typecheck
